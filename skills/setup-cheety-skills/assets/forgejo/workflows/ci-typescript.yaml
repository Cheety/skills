name: CI TypeScript

on:
  pull_request:
  push:
    branches: [main]

env:
  STACK_PROFILE: typescript

jobs:
  pruefe:
    runs-on: docker
    container:
      image: node:22
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Python for the principle checker
        run: apt-get update -qq && apt-get install -y -qq python3

      - run: npm ci

      - name: 1 - Formatting
        run: npx prettier --check .

      - name: 2 - Type check
        run: npx tsc --noEmit

      - name: 3 - Lint
        run: npx eslint .

      - name: 4 - Principle rules
        run: python3 tools/arch-check/arch_check.py . --profile "$STACK_PROFILE"

      - name: 5 - Self-test of the rules
        run: python3 tools/arch-check/eval.py --profile "$STACK_PROFILE"

      - name: 6 - Tests
        run: npx vitest run
        env:
          DATABASE_URL: postgres://testing:testing@postgres:5432/testing
