name: CI Python

on:
  pull_request:
  push:
    branches: [main]

env:
  STACK_PROFILE: python

jobs:
  pruefe:
    runs-on: docker
    container:
      image: python:3.12
    timeout-minutes: 15

    # Real Postgres, not SQLite — see profiles/python/PROFILE.md, the test suite
    # runs against the same engine as production.
    #
    # Deliberately no `ports:`. A Forgejo runner is a long-lived shared host —
    # publishing 5432 to it makes the second concurrent job fail with "port is
    # already allocated". The job container reaches the service by name anyway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5

    steps:
      # Deliberately no `uses: …/checkout`: that is a JavaScript action, and
      # Forgejo runs it with the `node` of this container — which a Python image
      # does not have (`exec: "node": executable file not found in $PATH`).
      # Installing node here just to clone is the more expensive of the two
      # wrong answers, so the clone is done by hand. See FORGES.md.
      - name: Check out the sources
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # Token in the local config rather than in the URL or on the command
          # line: it stays out of `ps` output and out of the remote URL.
          git config --local "http.$GITHUB_SERVER_URL/.extraheader" \
            "Authorization: basic $(printf 'x-access-token:%s' "$RUNNER_TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
        env:
          # Provided automatically by Forgejo for the duration of the run.
          RUNNER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The one line to adjust: replace with `pip install -e '.[dev]'`,
      # `uv sync --dev` or whatever this repository actually uses.
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Order: cheapest check first, so CI fails early.

      - name: 1 - Formatting
        run: ruff format --check .

      - name: 2 - Lint
        run: ruff check .

      - name: 3 - Type check
        run: mypy --strict src

      - name: 4 - Principle rules
        run: python3 tools/arch-check/arch_check.py . --profile "$STACK_PROFILE"

      - name: 5 - Self-test of the rules
        run: python3 tools/arch-check/eval.py --profile "$STACK_PROFILE"

      - name: 6 - Tests
        run: python3 -m pytest
        env:
          # Service name, not 127.0.0.1: the job itself runs in a container.
          DATABASE_URL: postgresql://testing:testing@postgres:5432/testing

      # Deliberately NO coverage threshold. A percentage target reliably produces
      # tests without assertions.
